apiVersion: v1
kind: Service
metadata:
  name: nuage-honeytrap
  labels:
    app.kubernetes.io/name: nuage-honeytrap
    app: nuage-honeytrap
spec:
  type: ClusterIP
  selector:
    app: nuage-honeytrap
  ports:
    - name: ssh
      protocol: TCP
      port: 22
      targetPort: ssh
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: postgres
